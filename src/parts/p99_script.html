
<script>
(function () {
  "use strict";
  var KEY = "fima-lernpfad-done-v1";
  var MODS = ["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10","m11"];

  // ---------- Fortschritt (nur in diesem Browser) ----------
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { /* Speicher gesperrt: Seite funktioniert trotzdem */ } }
  function render(list) {
    MODS.forEach(function (m) {
      var on = list.indexOf(m) !== -1;
      var cb = document.getElementById("done-" + m);
      if (cb) cb.checked = on;
      var a = document.querySelector('.toc a[data-mod="' + m + '"]');
      if (a) a.classList.toggle("done", on);
    });
    var n = list.filter(function (m) { return MODS.indexOf(m) !== -1; }).length;
    document.getElementById("progress-text").textContent = n + " von " + MODS.length + " Modulen erledigt";
    document.getElementById("progress-bar").style.width = (n / MODS.length * 100) + "%";
  }
  var done = load();
  render(done);
  document.querySelectorAll("[data-done]").forEach(function (cb) {
    cb.addEventListener("change", function () {
      var m = cb.getAttribute("data-done");
      done = done.filter(function (x) { return x !== m; });
      if (cb.checked) done.push(m);
      save(done);
      render(done);
    });
  });

  // ---------- aktives Kapitel in der Leiste ----------
  var links = {};
  document.querySelectorAll(".toc a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.remove("active"); });
          var a = links[en.target.id];
          if (a) {
            a.classList.add("active");
            if (window.matchMedia("(max-width: 960px)").matches && a.scrollIntoView) {
              var bar = a.parentElement;
              bar.scrollTo({ left: a.offsetLeft - 16, behavior: "smooth" });
            }
          }
        }
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll("main > section[id]").forEach(function (s) { io.observe(s); });
  }

  // ---------- Tooltips für Diagramme ----------
  var tip = document.getElementById("tip");
  function showTip(el, x, y) {
    tip.textContent = el.getAttribute("data-tip");
    tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(x + 14, window.innerWidth - w - 8);
    var top = y + 16;
    if (top + h > window.innerHeight - 8) top = y - h - 12;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = Math.max(8, top) + "px";
  }
  document.addEventListener("pointermove", function (e) {
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true;
  });
  document.addEventListener("pointerdown", function (e) {
    var el = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true;
  });
  window.addEventListener("scroll", function () { tip.hidden = true; }, { passive: true });

  // ---------- Zahlenformat ----------
  function de(v, d) {
    if (!isFinite(v)) return "–";
    return v.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function num(s) {
    s = String(s).trim().replace(/\s/g, "").replace("−", "-");
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(",", ".");
    return parseFloat(s);
  }

  // ---------- Leverage-Rechner ----------
  function lev() {
    var ek = num(document.getElementById("lev-ek").value), fk = num(document.getElementById("lev-fk").value);
    var r = num(document.getElementById("lev-r").value) / 100, rfk = num(document.getElementById("lev-rfk").value) / 100;
    var out = document.getElementById("lev-out");
    if (!(ek > 0) || !(fk >= 0) || !isFinite(r) || !isFinite(rfk)) { out.innerHTML = "Bitte Eigenkapital größer 0 und gültige Zahlen eingeben."; return; }
    var vg = fk / ek, rek = r + (r - rfk) * vg, bg = r * (ek + fk), z = rfk * fk;
    var fall = r > rfk ? "r &gt; r<sub>FK</sub>: Der Hebel wirkt positiv, mehr Fremdkapital erhöht die EK-Rendite." :
               r < rfk ? "r &lt; r<sub>FK</sub>: Leverage-Risiko, mehr Fremdkapital senkt die EK-Rendite." :
               "r = r<sub>FK</sub>: Der Verschuldungsgrad ist ohne Einfluss.";
    out.innerHTML = "Verschuldungsgrad FK/EK = " + de(vg, 2) +
      "<br>r<sub>EK</sub> = " + de(r * 100, 2) + " % + (" + de(r * 100, 2) + " % − " + de(rfk * 100, 2) + " %) · " + de(vg, 2) + " = <b>" + de(rek * 100, 2) + " %</b>" +
      "<br>Probe: BG " + de(bg, 2) + " − Zinsen " + de(z, 2) + " = Gewinn " + de(bg - z, 2) + " → " + de((bg - z) / ek * 100, 2) + " %" +
      "<br>" + fall;
  }
  ["lev-ek","lev-fk","lev-r","lev-rfk"].forEach(function (id) { document.getElementById(id).addEventListener("input", lev); });
  lev();

  // ---------- Kapitalwert / IZF ----------
  function npv(cf, i) { var s = 0; for (var t = 0; t < cf.length; t++) s += cf[t] / Math.pow(1 + i, t); return s; }
  function kw() {
    var raw = document.getElementById("kw-cf").value;
    var parts = raw.indexOf(";") !== -1 || raw.indexOf("\n") !== -1 ? raw.split(/[;\n]/) : raw.split(/\s+/);
    var cf = parts.map(num).filter(function (v) { return isFinite(v); });
    var i = num(document.getElementById("kw-i").value) / 100;
    var out = document.getElementById("kw-out");
    if (cf.length < 2 || !isFinite(i)) { out.innerHTML = "Mindestens zwei Zahlungen mit Semikolon getrennt eingeben, z. B. -195; 107; 110."; return; }
    var rows = [], sum = 0;
    for (var t = 0; t < cf.length; t++) {
      var f = 1 / Math.pow(1 + i, t), bw = cf[t] * f; sum += bw;
      rows.push("t" + t + ": " + de(cf[t], 2) + " · " + de(f, 4) + " = " + de(bw, 2));
    }
    var signs = 0; for (var k = 1; k < cf.length; k++) if ((cf[k] < 0) !== (cf[k - 1] < 0) && cf[k] !== 0) signs++;
    var lo = -0.99, hi = 10, flo = npv(cf, lo), fhi = npv(cf, hi), irr = NaN;
    if (flo * fhi < 0) {
      for (var n = 0; n < 200; n++) { var m = (lo + hi) / 2, fm = npv(cf, m); if (flo * fm <= 0) { hi = m; fhi = fm; } else { lo = m; flo = fm; } }
      irr = (lo + hi) / 2;
    }
    out.innerHTML = rows.join("<br>") +
      "<br><b>Kapitalwert bei " + de(i * 100, 2) + " %: " + de(sum, 2) + "</b> → " + (sum > 0 ? "vorteilhaft" : sum < 0 ? "nicht vorteilhaft" : "genau Mindestverzinsung") +
      "<br><b>Interner Zinsfuß: " + (isFinite(irr) ? de(irr * 100, 2) + " %" : "nicht eindeutig bestimmbar") + "</b>" +
      (signs > 1 ? "<br>Achtung: mehrere Vorzeichenwechsel, der IZF kann mehrdeutig sein." : "");
  }
  ["kw-cf","kw-i"].forEach(function (id) { document.getElementById(id).addEventListener("input", kw); });
  kw();

  // ---------- Zinstage, Zinsen, Diskont ----------
  function parseDate(s) { var p = s.split("-"); return p.length === 3 ? { y: +p[0], m: +p[1], d: +p[2] } : null; }
  function lastFeb(dt) { return dt.m === 2 && dt.d === new Date(Date.UTC(dt.y, 2, 0)).getUTCDate(); }
  function days(a, b, met) {
    if (met === "30360") {
      var d1 = (a.d === 31 || lastFeb(a)) ? 30 : a.d;
      var d2 = (b.d === 31 || lastFeb(b)) ? 30 : b.d;
      return 360 * (b.y - a.y) + 30 * (b.m - a.m) + (d2 - d1);
    }
    return Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000);
  }
  function zt() {
    var a = parseDate(document.getElementById("zt-von").value), b = parseDate(document.getElementById("zt-bis").value);
    var met = document.getElementById("zt-met").value;
    var k = num(document.getElementById("zt-k").value), p = num(document.getElementById("zt-p").value) / 100, d = num(document.getElementById("zt-d").value) / 100;
    var out = document.getElementById("zt-out");
    if (!a || !b || !isFinite(k) || !isFinite(p)) { out.innerHTML = "Bitte zwei Daten und gültige Zahlen eingeben."; return; }
    var t = days(a, b, met), basis = met === "act365" ? 365 : 360;
    var z = k * p * t / basis;
    var lin = isFinite(d) ? k * d * t / basis : NaN, bw = isFinite(d) ? k / (1 + d * t / basis) : NaN;
    out.innerHTML = "Zinstage: <b>" + t + "</b> (Basis " + basis + ")" +
      "<br>Zinsen auf den Betrag = " + de(k, 2) + " · " + de(p * 100, 2) + " % · " + t + "/" + basis + " = <b>" + de(z, 2) + " €</b>" +
      (isFinite(d) ? "<br>Ist der Betrag ein Wechselbetrag: Diskont linear (" + de(d * 100, 2) + " %) " + de(lin, 2) + " € → Auszahlung <b>" + de(k - lin, 2) + " €</b>" +
      " · Barwertmethode: " + de(bw, 2) + " €" : "");
  }
  ["zt-von","zt-bis","zt-met","zt-k","zt-p","zt-d"].forEach(function (id) {
    var el = document.getElementById(id); el.addEventListener("input", zt); el.addEventListener("change", zt);
  });
  zt();
})();
</script>
